# Assumptions register (CLAUDE.md golden rule 2). Every [A] value or interpretation a tool uses MUST be here.
# Seeded by WP-00 from GEOAGENT_DESIGN_SPEC §2.3 (DB-34) and §2.4 (DB-30…DB-40). Note: the spec defines no DB-39.
# Later WPs append entries (never rename/remove); set added_by to the WP id and note them in PROGRESS.md.
# Fields: id, title, value, unit, justification, source, sensitivity, tag (P/D/L/W/A), status, added_by.
# Schema: gemini_agent.schemas.config.AssumptionsRegister.
schema_version: 1
assumptions:
  - id: DB-30
    title: Meaning of "330 daily steps" (doublet availability)
    value:
      interpretation: A
      doublet_available_days_per_yr: 330
      planned_outage_days_per_doublet: 35
      outages_may_overlap: false
      outage_schedule: chosen by the optimiser
      demand_met_days_per_yr: 365
    unit: null
    justification: >-
      Availability interpretation: each doublet is available 330 of 365 days (35-day planned outage,
      never overlapping); heating and cooling demand must be met on all 365 days. 330/365 = 90.4 %
      matches the standard 90 % availability planning assumption; it is the conservative reading
      (forces backup capacity) and a design that passes it also passes the "simulate only 330 days" reading.
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-30; ESMAP p.31 [L]
    sensitivity: "Interpretation B: simulate 330 days with no outage; report both."
    tag: A
    status: default
    added_by: WP-00

  - id: DB-31
    title: District-heating return temperature
    value: 55.0
    unit: degC
    justification: >-
      100/55 °C network. Between measured Danish returns of 40–43 °C (Danfoss/Thisted p.4–5) and
      conventional geothermal practice of ΔT >= 17–22 K (Guidebook p.231, 234); 55 °C lets the plate
      HEX cool brine ≈ 86 → 58 °C before the heat-pump evaporator takes it to >= 46 °C. The agent MAY
      treat the return temperature as a design lever.
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-31; Danfoss/Thisted p.4–5 [L]; Guidebook p.231, 234 [L]
    sensitivity: [45.0, 65.0, 75.0]
    tag: A
    status: default
    added_by: WP-00

  - id: DB-32
    title: Cooling-network return temperature
    value: 26.0
    unit: degC
    justification: 20/26 °C; direct-cooling grids run ΔT 5–6 K.
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-32; Shallow DHC review p.8 [L]
    sensitivity: [24.0, 28.0]
    tag: A
    status: default
    added_by: WP-00

  - id: DB-33
    title: Brine specific heat capacity
    value: 4100.0
    unit: J/(kg K)
    justification: Saline brine is below fresh water 4.19 kJ/(kg K) (the Guidebook uses fresh-water values).
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-33
    sensitivity: [4000.0, 4190.0]
    tag: A
    status: default
    added_by: WP-00

  - id: DB-34a
    title: Daily ambient temperature series for 2027
    value:
      method: piecewise_linear
      anchor_day_of_month: 15
      wrap_year: true
      data: config/climate_nl.yaml
    unit: null
    justification: >-
      Smooth seasonal profile from KNMI De Bilt 1991–2020 monthly normals placed at mid-month.
    source: GEOAGENT_DESIGN_SPEC §2.3 DB-34a; RC-07; KNMI normals [W]
    sensitivity: "Warm-climate case (DB-34b)."
    tag: A
    status: default
    added_by: WP-00

  - id: DB-34-RH
    title: Monthly relative humidity (for wet-bulb)
    value: [87, 84, 80, 75, 74, 76, 77, 78, 82, 85, 88, 88]
    unit: "%"
    justification: >-
      No KNMI RH normals obtained; assumed values used with the Stull (2011) formula to derive monthly
      wet-bulb. Replace with KNMI normals if obtained.
    source: GEOAGENT_DESIGN_SPEC §2.3; RC-07 [A]
    sensitivity: "Warm-climate design point 30 °C DB / 21 °C WB (DB-34b)."
    tag: A
    status: default
    added_by: WP-00

  - id: DB-34b
    title: Summer design point for chiller and heat-rejection sizing
    value:
      dry_bulb_degc: 25.0
      wet_bulb_degc: 18.4
      warm_case_dry_bulb_degc: 30.0
      warm_case_wet_bulb_degc: 21.0
    unit: degC
    justification: >-
      1 % cooling dry-bulb with mean coincident wet-bulb, Amsterdam WMO 062400 (1973–1996) [W]. The warm
      case (30 °C DB / 21 °C WB) is an assumption [A] because the record pre-dates recent warming.
    source: GEOAGENT_DESIGN_SPEC §2.3 DB-34b; RC-07; NOAA Engineering Weather Data [W]; warm case [A]
    sensitivity: "Warm-climate case 30 °C DB / 21 °C WB."
    tag: W
    status: default
    added_by: WP-00

  - id: DB-34c
    title: Annual mean air and shallow-ground temperature
    value:
      annual_mean_air_degc: 10.5
      shallow_ground_degc: 12.5
    unit: degC
    justification: >-
      Annual mean = mean of the KNMI monthly normals [W] (10.52 °C) [D]; shallow ground ≈ air mean
      + 2 °C [L]; consistent with DB-04 (surface 12 °C).
    source: GEOAGENT_DESIGN_SPEC §2.3 DB-34c; Shallow DHC review p.3 [L]
    sensitivity: null
    tag: D
    status: default
    added_by: WP-00

  - id: DB-34d
    title: Exergy dead state
    value: daily_dry_bulb
    unit: null
    justification: Dead state T0 = daily ambient dry-bulb; stated in every exergy KPI.
    source: GEOAGENT_DESIGN_SPEC §2.3 DB-34d; DiPippo Ch10 p.7 [L]
    sensitivity: null
    tag: L
    status: default
    added_by: WP-00

  - id: DB-35
    title: Cost data policy
    value:
      labelled_sources_only: true
      min_sensitivity_frac: 0.30
    unit: null
    justification: >-
      Only labelled sources (spec §9.2). The former '[A] placeholder' items now carry the RC-10 "Sourced
      values"; sensitivity is ±30 % or the item's stated range, whichever is wider (ECO-04).
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-35, §9.2 ECO-04; RC-10; config/cost_assumptions.yaml
    sensitivity: "±30 % or the stated range, whichever is wider."
    tag: A
    status: default
    added_by: WP-00

  - id: DB-36
    title: Associated-gas handling
    value:
      decision_variable: true
      options: [degas_use, pressurised_reinject]
      venting_allowed: false
    unit: null
    justification: >-
      Decision variable, not an assumption (DR-07): (a) degas and use the gas in CHP/boiler with
      calcite inhibitor, or (b) keep the loop pressurised and reinject dissolved gas. Venting CH4 is
      never allowed. Degassing CO2 raises calcite scaling risk; Pleasant Bayou precedent for burning
      separated methane.
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-36; DiPippo §4.4, §9.6.3 [L]; WEC p.15 [L]; Guidebook p.160 [L]
    sensitivity: "Both variants simulated."
    tag: A
    status: default
    added_by: WP-00

  - id: DB-37
    title: Grid electricity CO2 intensity
    value: 0.3
    unit: kg/kWh
    justification: Value used in the GEMINI example.
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-37; GEMINI example
    sensitivity: [0.2, 0.4]
    tag: A
    status: default
    added_by: WP-00

  - id: DB-38
    title: Skin, wellbore radius, drainage radius
    value:
      skin: 0.0
      wellbore_radius_m: 0.108
      drainage_radius_m: 1000.0
    unit: null
    justification: Skin 0; rw = 0.108 m (8½-inch hole); re = 1,000 m.
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-38
    sensitivity:
      skin: [-1.0, 5.0]
    tag: A
    status: default
    added_by: WP-00

  - id: DB-40
    title: Meaning of the 70 % pump efficiency
    value:
      pump_hydraulic_efficiency_frac: 0.70
      motor_efficiency_frac: 0.93
      vfd_efficiency_frac: 0.97
    unit: null
    justification: >-
      70 % is the pump hydraulic (shaft) efficiency; motor and VFD losses are added separately
      (motor 93 %, VFD 97 % [A]). Guidebook examples use 60–65 % wire-to-water.
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-40; Guidebook p.256–263 [L]
    sensitivity: "Wire-to-water 70 %."
    tag: A
    status: default
    added_by: WP-00

  - id: ECO-CUR
    title: Reporting currency for costs
    value: USD
    unit: null
    justification: >-
      The cost basis (currency, discount rate, energy prices) is an open question for the organisers
      (spec §17 Q5). RC-10 reports every sourced value in USD as well as natively. Values are stored
      natively (EUR, USD, AUD with price year) and converted in code with eur_to_usd = 1.13 (ECB 2025
      annual average), aud_to_usd = 0.63, the DEA 2020→2025 EUR factor 1.168 and CEPCI where marked.
      The price-year mismatch between sources (2002/2011/2020/2023/2025 EUR and USD; NREL dollar-year
      not stated) is accepted as ± a few % (RC-10).
    source: RC-10 (incl. Sourced values); GEOAGENT_DESIGN_SPEC §17 Q5 (open)
    sensitivity: "eur_to_usd 1.08–1.13; revisit when the organisers answer §17 Q5."
    tag: A
    status: default
    added_by: WP-00

  - id: SUB-RHOC
    title: Aquifer volumetric heat capacity (thermal-breakthrough screening)
    value: 2500000.0
    unit: J/(m3 K)
    justification: >-
      Gringarten–Sauty (1975) breakthrough time t_b = π h D² (ρC)_a / (3 (ρC)_w Q) needs the
      volumetric heat capacity of the saturated aquifer; RC-02 gives ≈ 2.5e6 J/(m³ K) [A]. With
      h = 100 m and Q = 300 m³/h it reproduces DB-26 (23.6 yr at D = 1.0 km, 34 yr at 1.2 km).
    source: RC-02 eq 1 [A]; GEOAGENT_DESIGN_SPEC §2.2 DB-26
    sensitivity: >-
      No range on RC-02; t_b is linear in (ρC)_a, so a ±x % change moves t_b by ±x % (WP-05/WP-11 to
      choose the range).
    tag: A
    status: default
    added_by: WP-04

  - id: DEM-COP-HD
    title: Screening COP of heat-driven cooling (demand profiling only)
    value: 0.75
    unit: "-"
    justification: >-
      Used only by the demand tool to build the screening profile "heating + cooling / COP" (the heat a
      geothermal plant would supply if all cooling were heat-driven). Spec §3.2 states this screening
      value (window 6 May–9 Jun, ≈ 143 GWh/yr). Sizing and simulation use the calibrated RC-05
      absorption-chiller model, which gives COP ≈ 0.60–0.70 for 85–105 °C drive heat.
    source: GEOAGENT_DESIGN_SPEC §3.2 [A]; RC-05 (COP 0.60–0.70) [L]
    sensitivity: [0.60, 0.70]
    tag: A
    status: default
    added_by: WP-04

  - id: SUB-II
    title: Injectivity index of the injector
    value: equal_to_pi
    unit: null
    justification: >-
      The injector's injectivity index II is taken equal to the producer's PI (same reservoir, same
      completion), so injection bottom-hole pressure is P_res + Q/II (RC-01 item 4, DiPippo eq
      4.14–4.15). Used by TL-01 to show that an injection pump is needed (DB-21).
    source: RC-01 item 4 [A]
    sensitivity: "Cold-water injection usually lowers II (viscosity); WP-05 may add a factor."
    tag: A
    status: default
    added_by: WP-04

  - id: COOL-ABS-B
    title: Dühring slope B of the LiBr absorption-chiller characteristic equation
    value: 1.15
    unit: "-"
    justification: >-
      RC-05 Method B (ΔΔt = (t_G − t_AC) − B (t_AC − t_E)) gives B ≈ 1.1–1.2 for LiBr without a single
      value; the mid-point is used. With B = 1.15, raising the mean evaporator temperature by 14 K is worth
      ≈ 16 K of drive temperature (RC-05 screening statement 15–17 K).
    source: RC-05 Method B [A]; gemini_model.absorption_chiller (GM-04)
    sensitivity: [1.1, 1.2]
    tag: A
    status: default
    added_by: WP-02

  - id: COOL-ABS-CAL
    title: Absorption-chiller characteristic coefficients calibrated to Method A (no datasheet)
    value:
      fit: weighted least squares (relative error) on Method A rating points
      rating_points: "T_chw 44 °F, T_cw 85 °F, T_hw 180–240 °F every 5 °F"
      generator_delta_t_k: 7.2
      cooling_water_range_k: 5.0
      chilled_water_delta_t_k: 6.0
      s_e_per_k: 0.022260
      ddt_min_k: 9.503
      s_g_per_k: 0.032491
      ddt_min_g_k: 7.453
    unit: null
    justification: >-
      RC-05 leaves the Method B coefficients MISSING and says to calibrate them to a datasheet or, failing
      that, to Method A at its rating points. Method A gives inlet/leaving temperatures, so circuit means use
      the generator ΔT 7.2 K [L Guidebook p.267], a cooling-water range of 5 K [A RC-07] and a chilled-water
      ΔT of 6 K [A: the DB-32 design ΔT; the card gives no rating ΔT]. On the rating points the fit matches
      Method A within 1.0 % (capacity) and 2.1 % (COP). At 20 °C chilled water the method is extrapolated
      (RC-05: uncertain); off the rating line Method A's product form F_T·F_c diverges from ΔΔt (up to 0.27
      of nominal capacity at 180 °F / 50 °F / 75 °F).
    source: RC-05 Method B option (ii); gemini_model.absorption_chiller.characteristic.calibrate_to_ghc1989
    sensitivity: >-
      Method A ("ghc1989", conservative lower bound) and B = 1.1 / 1.2; replace with a datasheet fit
      (characteristic.fit_coefficients) if one is found.
    tag: A
    status: default
    added_by: WP-02

  - id: COOL-ABS-CAP
    title: Absorption-chiller capacity never exceeds the nameplate rating
    value: 1.0
    unit: fraction of nominal capacity
    justification: >-
      With cold cooling water and 20 °C chilled water the calibrated characteristic equation (and Method A
      outside validity) can exceed the nominal capacity; the model credits at most the nameplate rating
      (max_capacity_fraction), which is conservative for sizing.
    source: engineering judgement [A]; GM-04
    sensitivity: null
    tag: A
    status: default
    added_by: WP-02

  - id: COOL-ABS-LB
    title: Method A outside its validity is evaluated at the conservative validity edge
    value:
      chilled_water_above_degf: 50.0
      cooling_water_below_degf: 75.0
    unit: degF
    justification: >-
      RC-05: outside 40–50 °F chilled / 75–90 °F cooling water Method A is a lower bound only. F rises with the
      chilled-water and falls with the cooling-water temperature, so chilled water above 50 °F is evaluated
      at 50 °F and cooling water below 75 °F at 75 °F (never overstates capacity); a validity warning is
      reported. Other excursions are extrapolated with a warning.
    source: RC-05 Method A [A interpretation]; parameter ghc1989_conservative_clamp
    sensitivity: "ghc1989_conservative_clamp: false (raw extrapolation)."
    tag: A
    status: default
    added_by: WP-02

  - id: COOL-ABS-AUX
    title: Absorption-chiller auxiliary power (extra tower fan and cooling-water pump)
    value: 0.021894
    unit: fraction of cooling duty
    justification: >-
      0.077 kW/ton ÷ 3.517 kW/ton ≈ 2.2 % of Q_cool (Guidebook p.269), the extra tower fan and cooling-water
      pump of absorption versus electric chilling. If the project also has a heat_rejection component that
      counts the tower fan and pumps (2 % of heat rejected), set the chiller's aux_power_fraction to 0 to avoid
      counting them twice.
    source: RC-05 Auxiliaries [L Guidebook p.269]
    sensitivity: null
    tag: L
    status: default
    added_by: WP-02

  - id: COOL-ABS-PL
    title: Absorption-chiller part-load behaviour
    value:
      characteristic: "ΔΔt reduced to ΔΔt_min + Q_E/s_E; Q_G = s_G (ΔΔt − ΔΔt_min,G)"
      ghc1989: "COP(T_hw) unchanged; Q_G = Q_E / COP"
    unit: null
    justification: >-
      RC-05 gives no part-load rule. Method B: part load is a reduction of the characteristic temperature
      difference (drive-temperature control, Ziegler/Hellmann), so the drive heat keeps an offset s_G (ΔΔt_min −
      ΔΔt_min,G) ≈ 0.067 Q_nom and the COP falls at low load (≈ 0.47 at 10 % and 0.21 at 2 % load at 85 °C
      drive); it drops to 0 only when the machine stops (Q_E = 0). Method A has no part-load information, so
      its COP is kept. Dispatch (WP-07) should avoid very low absorption loads.
    source: RC-05 Method B form [A interpretation]; Method A [A]
    sensitivity: "Constant COP at part load (Method A rule) as an optimistic bound."
    tag: A
    status: default
    added_by: WP-02

  - id: COOL-ABS-DRV
    title: Absorption-chiller drive-side consistency with a given drive flow
    value:
      characteristic_min_drive_capacity_rate: "C_G >= s_G / 2 (minimum_drive_flow_rate_m3s), else machine off"
      ghc1989_drive_outlet_floor_degc: 71.4
    unit: null
    justification: >-
      With arithmetic-mean circuit temperatures, the drive outlet stays above the machine's minimum generator
      temperature t_G,min = ΔΔt_min,G + (1+B) t̄_AC − B t̄_E exactly when the drive capacity rate C_G = ρ c_p V
      ≥ s_G/2 (independent of the operating point; ≈ 13.9 m³/h of water per MW of nominal capacity). Below that
      the characteristic equation over-credits capacity with an outlet that violates the model (and can fall
      below the cooling water), so the machine is treated as off and a warning is returned. Method A has no
      flow term: the drive heat is limited so the outlet stays at or above its zero-capacity temperature
      (160.5 °F = 71.4 °C), and Q_E = Q_G · COP. Without a given flow the fixed 7.2 K generator ΔT is used.
    source: derived from RC-05 Method B / Method A [A interpretation]; WP-02 reviews
    sensitivity: null
    tag: A
    status: default
    added_by: WP-02

  - id: COOL-ELC
    title: Electric-chiller COP model defaults
    value:
      carnot_efficiency: 0.40
      evaporator_approach_k: 4.0
      condenser_approach_k: 3.0
      tower_approach_k: 4.5
      cooling_water_range_k: 5.0
      dry_cooler_condenser_offset_k: 8.0
      cop_max: 8.0
      cop_min: 3.0
    unit: null
    justification: >-
      COP = η T_evap/(T_cond − T_evap); η 0.39–0.40 implied by the Guidebook (COP 4.39 at 45/90 °F, 4.07 at
      45/95 °F) [L]; T_evap = supply − 4 K, T_cond = tower leaving water (T_wb + 4–5 K approach + 5 K range)
      + 3 K, or T_db + 8 K with an air-cooled (dry) condenser; COP capped at 8 and floored at 3 [A]. Known
      bias: the card's η was implied with the water temperatures as cycle temperatures; through the −4 K/+3 K
      chain the Guidebook point (COP 4.39) needs η ≈ 0.44, so η 0.40 understates the COP by ≈ 9–11 %
      (overstates electric power, favouring absorption in comparisons). The constant-η model is also steeper
      (−4.0 %/K at 7.2/32.2 °C) than the Guidebook data (≈ −2.6 %/K). A water-loop dry cooler (heat_rejection,
      T_db + 5 K) feeding the condenser gives T_db + 13 K instead of T_db + 8 K (COP 5.26 vs 6.80 at 25 °C).
      The spec GM-05 row omits the 5 K range; the card (with range) is followed.
    source: RC-06 [L Guidebook p.257–258] and [A]; spec GM-05
    sensitivity: "η 0.44 (consistent with the approach chain) and 0.39; tower approach 4–5 K; dry cooler T_db + 13 K (water loop)."
    tag: A
    status: default
    added_by: WP-02

  - id: COOL-HR
    title: Heat-rejection (cooling tower / dry cooler) defaults
    value:
      tower_approach_k: 4.5
      range_k: 5.0
      aux_power_fraction: 0.02
      dry_cooler_approach_k: 5.0
      dry_cooler_power_factor: 3.0
      latent_heat_j_kg: 2450000.0
    unit: null
    justification: >-
      Tower leaving water = T_wb + approach (4–5 K → 4.5) [A], range ≈ 5 K [A], fan + pump ≈ 2 % of heat
      rejected [A]; dry cooler leaving water = T_db + 5 K [L RTES], fan power ≈ 3× wet [L DiPippo Ch23], applied
      to the whole 2 % (→ 6 %) [A]. Tower water use = Q_reject / h_fg with h_fg 2.45 MJ/kg (water at ≈ 20 °C,
      steam tables) [A]: an upper bound (all heat by evaporation). Cost and area ≈ 3× wet for a dry cooler are
      for economics (WP-08).
    source: RC-07 Heat rejection [A]/[L]; steam tables for h_fg [A]
    sensitivity: "tower approach 4–5 K; dry-cooler power factor 3 applied to the fan only."
    tag: A
    status: default
    added_by: WP-02

  - id: COOL-FC
    title: Free-cooling (water-side economiser) defaults
    value:
      tower_approach_k: 4.5
      hex_approach_k: 2.0
      aux_power_fraction: 0.02
    unit: null
    justification: >-
      Full free cooling when T_wb + 4.5 + 2 ≤ 20 °C (T_wb ≤ 13.5 °C), partial pre-cooling of the 26 °C return
      while T_wb + 6.5 < 26 °C; power = fan + pumps ≈ 2 % of the heat moved, i.e. a performance factor of 50
      (inside the 24–53 seasonal range).
    source: RC-07 Free cooling [A]; RC-03 plate-HEX approach 2–3 K
    sensitivity: "HEX approach 3 K; tower approach 5 K."
    tag: A
    status: default
    added_by: WP-02
