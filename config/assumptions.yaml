      η_L ≥ ≈ 0.39) η_L has no effect: the COP is set by VER-HP-ETA and HP-APPROACH, so run the sensitivity
      on those; η_L matters only on the Nelder-Mead path or with apply_cop_cap false.
    source: RC-04 parameter table (η_L default 0.50 [A]); GEMINI heatpump_basic default
    sensitivity: [0.40, 0.55]
