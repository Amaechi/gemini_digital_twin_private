  - id: EB-ETA
    title: Electric-boiler efficiency
    value: 0.99
    unit: "-"
    justification: >-
      Heat = 0.99 × electricity (spec GM-08); the DEA catalogue gives the same value. Losses 1 %. No direct
      emission; grid CO₂ is counted by economics (WP-08).
    source: spec §7.2 GM-08; RC-10 Sourced values (DEA Electricity & DH catalogue ch. 41 "Electric boilers")
    sensitivity: "none (DEA constant 2025–2050)"
    tag: L
    status: default
    added_by: WP-03

  - id: STO-REC-HT
    title: High-temperature ATES cycle recovery (and how the storage model applies it)
    value: 0.63
    unit: "-"
    justification: >-
      RC-09: HT-ATES recovers ≈ 63 % of the stored heat after 10 years (TU Delft). gemini_model.thermal_storage
      puts the whole recovery on discharge (η_c = 1, η_d = 0.63, no standing loss) [A], so one full
      charge/discharge cycle returns exactly 0.63 × the charged heat regardless of the holding time; a
      standing loss would double count it. Candidate C6 (seasonal HT-ATES) uses this value.
    source: RC-09 Thermal storage [L TU Delft HT-ATES]; split on discharge [A]
    sensitivity: "0.5 / 0.75 (early years recover less)"
    tag: L
    status: default
    added_by: WP-03

  - id: STO-REC-COLD
    title: Cold storage cycle recovery
    value: 0.96
    unit: "-"
    justification: >-
      RC-09: cold RTES recovers 96–99 % (RTES paper citing Pepin 2021); the lower end is used. Applied as for
      STO-REC-HT (η_c = 1, η_d = recovery). RC-09: daily storage adds little at daily resolution (≈ 12 h
      storage matters only with sub-daily data).
    source: RC-09 Thermal storage [L RTES]; lower end of the range [A]
    sensitivity: [0.96, 0.99]
    tag: L
    status: default
    added_by: WP-03

  - id: CHP-EL-FRAC
    title: CHP electrical share of the useful output (GEMINI chp.py vs DEA gas engine)
    value: 0.3333
    unit: "-"
    justification: >-
      Choice: simulations keep GEMINI chp.py unchanged — P_el = 1/3 and P_th = 2/3 of efficiency_factor ×
      fuel power (a class constant, not a parameter). The DEA 1–10 MW_e gas engine has η_e 0.48 and C_b 0.99
      (≈ 1.01 MW_th per MW_e), an electrical share ≈ 0.50 at ≈ 0.96 total efficiency. 1/3 is conservative
      for the electricity a degas + CHP option (DR-07 a) credits and generous on its heat. Economics (WP-08)
      must cost and credit the simulated P_el / P_th (not DEA η_e) so the energy and money balances agree.
      The 0.50 sensitivity needs an electrical-fraction parameter in chp.py (default 1/3) — add it only if a
      CHP candidate survives screening.
    source: GEMINI chp.py ELECTRICAL_POWER_FRACTION; RC-10 Sourced values (DEA ch. 06 gas engines)
    sensitivity: [0.3333, 0.50]
    tag: A
    status: default
    added_by: WP-03
