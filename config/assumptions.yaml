    justification: >-
      0.077 kW/ton ÷ 3.517 kW/ton ≈ 2.2 % of Q_cool (Guidebook p.269), the extra tower fan and cooling-water
      pump of absorption versus electric chilling. Applied only while include_heat_rejection_auxiliaries is
      true (default). When the project has a heat_rejection component that counts the tower fan and pumps
      (2 % of heat rejected), set include_heat_rejection_auxiliaries: false (RC-05/RC-06 no-double-counting
      rule): P_aux = 0 and Q_reject = Q_cool + Q_drive.
    source: RC-05 Auxiliaries [L Guidebook p.269]
    sensitivity: null
    tag: L
    status: default
    added_by: WP-02

  - id: COOL-ABS-PL
    title: Absorption-chiller part-load behaviour
    value:
      characteristic: "ΔΔt reduced to ΔΔt_min + Q_E/s_E; Q_G = s_G (ΔΔt − ΔΔt_min,G)"
      ghc1989: "COP(T_hw) unchanged; Q_G = Q_E / COP"
    unit: null
    justification: >-
      RC-05 gives no part-load rule. Method B: part load is a reduction of the characteristic temperature
      difference (drive-temperature control, Ziegler/Hellmann), so the drive heat keeps an offset s_G (ΔΔt_min −
      ΔΔt_min,G) ≈ 0.067 Q_nom and the COP falls at low load (≈ 0.47 at 10 % and 0.21 at 2 % load at 85 °C
      drive); it drops to 0 only when the machine stops (Q_E = 0). Method A has no part-load information, so
      its COP is kept. Dispatch (WP-07) should avoid very low absorption loads.
    source: RC-05 Method B form [A interpretation]; Method A [A]
    sensitivity: "Constant COP at part load (Method A rule) as an optimistic bound."
    tag: A
    status: default
    added_by: WP-02

  - id: COOL-ABS-DRV
    title: Absorption-chiller drive-side consistency with a given drive flow
    value:
      characteristic_min_drive_capacity_rate: "C_G >= s_G / 2 (minimum_drive_flow_rate_m3s), else machine off"
      ghc1989_drive_outlet_floor_degc: 71.4
    unit: null
    justification: >-
      With arithmetic-mean circuit temperatures, the drive outlet stays above the machine's minimum generator
      temperature t_G,min = ΔΔt_min,G + (1+B) t̄_AC − B t̄_E exactly when the drive capacity rate C_G = ρ c_p V
      ≥ s_G/2 (independent of the operating point; ≈ 13.9 m³/h of water per MW of nominal capacity). Below that
      the characteristic equation over-credits capacity with an outlet that violates the model (and can fall
      below the cooling water), so the machine is treated as off and a warning is returned. Method A has no
      flow term: the drive heat is limited so the outlet stays at or above its zero-capacity temperature
      (160.5 °F = 71.4 °C), and Q_E = Q_G · COP. Without a given flow the fixed 7.2 K generator ΔT is used.
    source: derived from RC-05 Method B / Method A [A interpretation]; WP-02 reviews
    sensitivity: null
    tag: A
    status: default
    added_by: WP-02

  - id: COOL-ELC
    title: Electric-chiller Carnot efficiency η on the model's refrigerant basis
    value:
      carnot_efficiency: 0.50834
      basis: "refrigerant: T_evap = chilled supply − 4 K, T_cond = condenser leaving water + 3 K"
      calibration_point: "COP 4.39 at 7.2 °C chilled / 32.2 °C condenser leaving water (Guidebook p.257–258)"
    unit: "-"
    justification: >-
      RC-06 "Temperature basis of η": the Guidebook's 0.39–0.40 is on the water basis (water temperatures in
      the COP equation). The model applies the −4 K / +3 K refrigerant offsets (COOL-ELC-APPROACH), so η is
      calibrated on that basis to reproduce the Guidebook point: η = 4.39 × (35.2 − 3.2) / (3.2 + 273.15) =
      0.50834 [D] (card: ≈ 0.51 / 0.508). The model does this itself (carnot_efficiency: null →
      electric_chiller.calibrated_carnot_efficiency from its own approach parameters), so changing an approach
      keeps the point reproduced. Bases are not mixed. With this η the COP cap of 8 binds at the Dutch design
      points (tower WB 18.4 / 21 °C, dry 25 °C); below the cap e.g. 6.7 with a dry cooler at 30 °C. P_el is
      compressor power only; tower fan and pumps belong to the heat-rejection model (RC-06).
    source: RC-06 temperature-basis row and validation test [D]; Guidebook p.257–258
    sensitivity: [0.44, 0.513]
    tag: D
    status: default
    added_by: WP-02

